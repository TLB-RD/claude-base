name: Update TGV Paper Report
on:
  # 테스트용: 한국시간 오후 3시 (UTC 06:00)
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-paper-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Search papers and create reports
        run: python search_papers.py
      - name: Commit and push reports
        run: |
          git config user.name "TLB Paper Agent"
          git config user.email "paper-agent@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "새로운 보고서 변경사항이 없습니다."
          else
            git commit -m "Update weekly TGV paper report"
            git push
          fi
